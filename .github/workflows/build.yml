name: Build APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APKs (standard + compatibility)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          cmdline-tools-version: latest

      - name: Install NDK r27
        run: |
          curl -sLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          # Verify NDK checksum (sha256)
          echo "8172a29a9816b0cfc6c2eabb416730b24b77bdaa8d8e7155309589ec74cdbdc5  /tmp/ndk.zip" | sha256sum -c - || {
            echo "NDK checksum mismatch — redownloading without cache"
            rm -f /tmp/ndk.zip
            curl -sLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          }
          unzip -q /tmp/ndk.zip -d /tmp/
          mkdir -p $ANDROID_HOME/ndk
          mv /tmp/android-ndk-r27 $ANDROID_HOME/ndk/27.0.12077973
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      # Generate local.properties for Gradle (ndkVersion is set in build.gradle.kts —
      # do NOT add ndk.dir here; it's deprecated and causes a warning in Cmake).
      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}
          workspaces: rust_core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew && chmod +x rust_core/build_android.sh

      - name: Bump Version on Push to Master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          # Extract current versionCode and versionName
          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          CURRENT_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          
          if [ -z "$CURRENT_CODE" ] || [ -z "$CURRENT_NAME" ]; then
            echo "Could not extract version from build.gradle.kts"
            exit 1
          fi
          
          NEW_CODE=$((CURRENT_CODE + 1))
          NEW_NAME=$NEW_CODE
          
          echo "Current version: $CURRENT_NAME ($CURRENT_CODE)"
          echo "New version: $NEW_NAME ($NEW_CODE)"
          
          # Update versionCode
          sed -i "s/versionCode\s*=\s*$CURRENT_CODE/versionCode = $NEW_CODE/" app/build.gradle.kts
          # Update versionName
          sed -i "s/versionName\s*=\s*\"$CURRENT_NAME\"/versionName = \"$NEW_NAME\"/" app/build.gradle.kts
          # Update buildConfigField VERSION_CODE
          sed -i "s/buildConfigField(\"int\", \"VERSION_CODE\", \"$CURRENT_CODE\")/buildConfigField(\"int\", \"VERSION_CODE\", \"$NEW_CODE\")/" app/build.gradle.kts
          # Update buildConfigField VERSION_NAME
          sed -i "s/buildConfigField(\"String\", \"VERSION_NAME\", \"$CURRENT_NAME\")/buildConfigField(\"String\", \"VERSION_NAME\", \"$NEW_NAME\")/" app/build.gradle.kts
          
          # Verify changes
          echo "Updated build.gradle.kts:"
          grep -E 'versionCode|versionName|VERSION_CODE|VERSION_NAME' app/build.gradle.kts
          
          # Commit with [skip ci] to avoid infinite loop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to $NEW_NAME [skip ci]"
          git push

      - name: Build Rust core for Android
        run: |
          cd rust_core
          ./build_android.sh

      # ── Standard build ──────────────────────────────────────────────────
      # Full-performance build: armv8.2-a+dotprod compile-time baseline.
      # Safe for Exynos 9825 and newer, Snapdragon 888 and newer.
      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug

      # ── Compatibility build ─────────────────────────────────────────────
      # Maximum-safety build: plain armv8-a baseline, no LTO, conservative
      # runtime defaults seeded on first launch. For old / rare / custom-ROM
      # ARM64 Android devices where dotprod-or-better can't be assumed even
      # as a compile-time floor.
      - name: Build Compatibility Debug APK
        run: ./gradlew assembleCompatibilityDebug

      - name: Locate APK outputs
        run: |
          echo "── Standard APK ──"
          find app/build/outputs/apk/standard -name "*.apk" || echo "(none)"
          echo "── Compatibility APK ──"
          find app/build/outputs/apk/compatibility -name "*.apk" || echo "(none)"

      - name: Check for tracked .so files in jniLibs
        run: |
          if git ls-files app/src/main/jniLibs/ | grep -q '\.so$'; then
            echo "::warning::Tracked .so files found in jniLibs — these should be excluded."
            git ls-files app/src/main/jniLibs/ | grep '\.so$'
          else
            echo "No tracked .so files — good."
          fi

      - name: Upload Standard Debug APK
        if: hashFiles('app/build/outputs/apk/standard/debug/app-standard-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-debug
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: warn

      - name: Upload Compatibility Debug APK
        if: hashFiles('app/build/outputs/apk/compatibility/debug/app-compatibility-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-compatibility-debug
          path: app/build/outputs/apk/compatibility/debug/app-compatibility-debug.apk
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/standard/debug/app-standard-debug.apk
            app/build/outputs/apk/compatibility/debug/app-compatibility-debug.apk
          body: |
            ## Two APKs in this release

            **app-standard-debug.apk** — recommended for most devices.
            Full performance build (armv8.2-a+dotprod baseline).
            Safe for Exynos 9825+, Exynos 2200, Snapdragon 888+, and
            essentially everything released after ~2018.

            **app-compatibility-debug.apk** — for old Samsung devices
            (Note 10 Lite and similar low-RAM / older-chipset phones) or
            any ARM64 device where the standard build crashes on load.
            Plain armv8-a baseline with zero compile-time CPU feature
            assumptions, LTO disabled for codegen predictability, and
            conservative defaults (2048 context, 2 threads, flash
            attention off, GPU layers off) seeded automatically on first
            launch. Slower, but built to never SIGILL.

            Both can be installed side-by-side — they use different
            application IDs (`com.gguf.zerocopy` vs `com.gguf.zerocopy.compat`).
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-release: every green master build gets a rolling v<versionName>
      # release with both APKs, so the captain can grab the APK from Releases
      # instead of digging through workflow artifacts. Idempotent (creates or
      # updates the same tag/assets).
      - name: Auto-release rolling build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          VERSION=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([0-9]*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION}"
          echo "Releasing tag $TAG"
          gh release create "$TAG" \
            app/build/outputs/apk/standard/debug/app-standard-debug.apk \
            app/build/outputs/apk/compatibility/debug/app-compatibility-debug.apk \
            --title "ZeroCopy v${VERSION}" \
            --notes "Auto-built from master by CI. Install the standard APK first; use compatibility on older devices." \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null \
          || gh release upload "$TAG" \
            app/build/outputs/apk/standard/debug/app-standard-debug.apk \
            app/build/outputs/apk/compatibility/debug/app-compatibility-debug.apk \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
